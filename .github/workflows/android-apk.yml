name: Android APK Build

# Jab chalega:
# 1. main branch par push hote hi (android/ folder me koi bhi change par)
# 2. Manually - GitHub Actions tab me "Run workflow" dabakar
on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          check-expiry: true

      - name: Show Android SDK
        run: sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List built APK
        working-directory: android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiyushOS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
